name: Verify HiredNext CV Studio

on:
  push:
    branches: [main]
    paths:
      - 'app/Commands/CvDoctor.php'
      - 'app/Commands/LyzrCvSetup.php'
      - 'app/Config/Routing.php'
      - 'app/Config/RoutesCvStudio.php'
      - 'app/Controllers/CvStudioAdmin.php'
      - 'app/Controllers/CvStudioDocumentController.php'
      - 'app/Database/Migrations/2026-08-31-160000_CreateCvDocuments.php'
      - 'app/Models/CvDocumentModel.php'
      - 'app/Services/Cv/CvCreationAgent.php'
      - 'app/Services/Cv/CvDocxRenderer.php'
      - 'app/Services/Cv/CvTextExtractor.php'
      - 'app/Services/Cv/OpenAiCvFileExtractor.php'
      - 'app/Services/Cv/LyzrClient.php'
      - 'app/Services/Cv/Provider/LyzrAgentProvider.php'
      - 'app/Services/Cv/Provider/OpenAiProvider.php'
      - 'app/Services/Cv/Provider/AnthropicProvider.php'
      - 'app/Services/Cv/Provider/GeminiProvider.php'
      - 'app/Services/Cv/CvWriterPanel.php'
      - 'app/Services/Cv/CvWriterPrompt.php'
      - 'app/Services/Cv/CvUpgradePlans.php'
      - 'app/Views/pages/admin/cv-studio-*.php'
      - 'app/Views/pages/admin/cv-reviews.php'
      - 'app/Views/pages/services/candidate-services.php'
      - 'app/Views/pages/services/cv-upgrade-payment.php'
      - '.github/workflows/cv-studio-ci.yml'
  workflow_dispatch:

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, curl
          coverage: none
      - name: PHP syntax gate
        shell: bash
        run: |
          set -euo pipefail
          files=(
            app/Commands/CvDoctor.php
            app/Commands/LyzrCvSetup.php
            app/Config/Routing.php
            app/Config/RoutesCvStudio.php
            app/Controllers/CvStudioAdmin.php
            app/Controllers/CvStudioDocumentController.php
            app/Database/Migrations/2026-08-31-160000_CreateCvDocuments.php
            app/Models/CvDocumentModel.php
            app/Services/Cv/CvCreationAgent.php
            app/Services/Cv/CvDocxRenderer.php
            app/Services/Cv/CvTextExtractor.php
            app/Services/Cv/OpenAiCvFileExtractor.php
            app/Services/Cv/LyzrClient.php
            app/Services/Cv/Provider/LyzrAgentProvider.php
            app/Services/Cv/Provider/OpenAiProvider.php
            app/Services/Cv/Provider/AnthropicProvider.php
            app/Services/Cv/Provider/GeminiProvider.php
            app/Services/Cv/CvWriterPanel.php
            app/Services/Cv/CvWriterPrompt.php
            app/Services/Cv/CvUpgradePlans.php
            app/Views/pages/admin/cv-studio-index.php
            app/Views/pages/admin/cv-studio-detail.php
            app/Views/pages/admin/cv-studio-document.php
            app/Views/pages/admin/cv-reviews.php
            app/Views/pages/services/candidate-services.php
            app/Views/pages/services/cv-upgrade-payment.php
          )
          for file in "${files[@]}"; do
            test -f "$file"
            php -l "$file"
          done
      - name: Route and safety assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "RoutesCvStudio.php" app/Config/Routing.php
          grep -Fq "CvStudioDocumentController::downloadWord" app/Config/RoutesCvStudio.php
          grep -Fq "CvStudioDocumentController::deliver" app/Config/RoutesCvStudio.php
          grep -Fq "Price on Request" app/Services/Cv/CvUpgradePlans.php
          ! grep -Fq "executive_2499" app/Services/Cv/CvUpgradePlans.php
          grep -Fq "No CV-writing AI is configured" app/Services/Cv/CvWriterPanel.php
          grep -Fq "Missing facts are flagged" app/Views/pages/admin/cv-studio-detail.php
          grep -Fq "SAMPLE PREVIEW" app/Views/pages/services/candidate-services.php
          grep -Fq "SAMPLE PREVIEW" app/Views/pages/services/cv-upgrade-payment.php
          grep -Fq "Why this is different from a generic AI rewrite" app/Views/pages/services/cv-upgrade-payment.php
          grep -Fq "cv_documents" app/Commands/CvDoctor.php
          grep -Fq "CV CREATION WRITERS" app/Commands/CvDoctor.php
          grep -Fq "application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml" app/Services/Cv/CvDocxRenderer.php
          grep -Fq "CvDocxRenderer" app/Controllers/CvStudioDocumentController.php
          grep -Fq "OpenAiCvFileExtractor" app/Services/Cv/CvTextExtractor.php
          grep -Fq "purpose' => 'user_data'" app/Services/Cv/OpenAiCvFileExtractor.php
          grep -Fq "store' => false" app/Services/Cv/OpenAiCvFileExtractor.php
          grep -Fq "x-api-key:" app/Services/Cv/LyzrClient.php
          grep -Fq "lyzr:cv-setup" app/Commands/LyzrCvSetup.php
          grep -Fq "lyzr-agents.json" app/Services/Cv/Provider/LyzrAgentProvider.php
          grep -Fq "openai_recruiter" app/Services/Cv/Provider/OpenAiProvider.php
          grep -Fq "claude_critic" app/Services/Cv/Provider/AnthropicProvider.php
          grep -Fq "gemini_rolefit" app/Services/Cv/Provider/GeminiProvider.php
