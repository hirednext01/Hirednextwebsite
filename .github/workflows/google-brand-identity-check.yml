name: Google Brand Identity Check

on:
  push:
    branches:
      - fix/google-brand-identity-20260916
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical brand facts
        run: php tests/search_entity_consistency_test.php
      - name: Verify PHP syntax
        run: |
          php -l app/Config/BrandFacts.php
          php -l app/Controllers/EntityAuthority.php
          php -l app/Controllers/Home.php
          php -l app/Controllers/SearchAuthority.php
