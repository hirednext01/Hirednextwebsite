name: Activate HiredNext Revenue Council Slack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-revenue-council-slack.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hirednext-revenue-council-slack-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_PASSWORD" || { echo 'HOSTINGER_PASSWORD missing'; exit 78; }
          test -n "$SLACK_BOT_TOKEN" || { echo 'SLACK_BOT_TOKEN missing'; exit 78; }
          test -n "$SLACK_SIGNING_SECRET" || { echo 'SLACK_SIGNING_SECRET missing'; exit 78; }
          echo 'Required activation secrets are present.'

      - name: Activate Slack bridge on Hostinger
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          HOST='145.79.213.68'
          PORT='65002'
          USER='u212644598'
          REMOTE="${USER}@${HOST}"
          SSH_ARGS=(-p "$PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          TOKEN_Q=$(printf '%q' "$SLACK_BOT_TOKEN")
          SECRET_Q=$(printf '%q' "$SLACK_SIGNING_SECRET")

          remote_run=$(cat <<EOF
          set -euo pipefail
          cd /home/u212644598/domains/hirednext.net/public_html
          TOKEN=$TOKEN_Q
          SECRET=$SECRET_Q
          test -f .env || touch .env
          chmod 600 .env || true
          sed -i '/^[[:space:]]*SLACK_BOT_TOKEN[[:space:]]*=/d' .env
          sed -i '/^[[:space:]]*SLACK_SIGNING_SECRET[[:space:]]*=/d' .env
          sed -i '/^[[:space:]]*SLACK_REVENUE_CHANNEL_IDS[[:space:]]*=/d' .env
          printf 'SLACK_BOT_TOKEN = %s\n' "\$TOKEN" >> .env
          printf 'SLACK_SIGNING_SECRET = %s\n' "\$SECRET" >> .env
          printf 'SLACK_REVENUE_CHANNEL_IDS = %s\n' 'C0BTXLQDHEF,C0BTZP75LRK,C0BU7JC1WJ0,C0BU5RF1N7K' >> .env
          chmod 600 .env || true
          php spark cache:clear >/dev/null 2>&1 || true

          AUTH=\$(curl -fsS -H "Authorization: Bearer \$TOKEN" https://slack.com/api/auth.test)
          printf '%s' "\$AUTH" | grep -Fq '"ok":true'
          BOT_USER_ID=\$(printf '%s' "\$AUTH" | sed -n 's/.*"user_id":"\([^"]*\)".*/\1/p')
          TEAM_ID=\$(printf '%s' "\$AUTH" | sed -n 's/.*"team_id":"\([^"]*\)".*/\1/p')
          test -n "\$BOT_USER_ID"
          test -n "\$TEAM_ID"
          echo "SLACK_BOT_AUTH=READY"
          echo "SLACK_BOT_USER_ID=\$BOT_USER_ID"
          echo "SLACK_TEAM_ID=\$TEAM_ID"

          BODY='{"type":"url_verification","challenge":"hn-revenue-council-ready"}'
          TS=\$(date +%s)
          HASH=\$(php -r 'echo hash_hmac("sha256", \$argv[1], \$argv[2]);' "v0:\$TS:\$BODY" "\$SECRET")
          RESP=\$(curl -fsS -X POST https://hirednext.net/webhooks/slack/revenue-council \
            -H 'Content-Type: application/json' \
            -H "X-Slack-Request-Timestamp: \$TS" \
            -H "X-Slack-Signature: v0=\$HASH" \
            --data "\$BODY")
          printf '%s' "\$RESP" | grep -Fq '"challenge":"hn-revenue-council-ready"'
          echo "SIGNED_WEBHOOK_TEST=READY"
          EOF
          )

          SSHPASS="$HOSTINGER_PASSWORD" sshpass -e ssh "${SSH_ARGS[@]}" "$REMOTE" "$remote_run"
