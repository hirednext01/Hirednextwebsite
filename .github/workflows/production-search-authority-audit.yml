name: Production Search Authority Audit

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/production_seo_audit.py'
      - 'public/robots.txt'
      - 'public/sitemap-search.xml'
      - 'app/Config/Routes.php'
      - 'app/Config/BrandFacts.php'
      - 'app/Controllers/Seo.php'
      - 'app/Controllers/SearchAuthority.php'
      - 'app/Controllers/CandidateServices.php'
      - 'app/Views/pages/home.php'
      - 'app/Views/pages/founder-profile.php'
      - 'app/Views/pages/services/**'
      - 'app/Views/pages/guides/**'
      - '.github/workflows/production-search-authority-audit.yml'
  pull_request:
    paths:
      - 'scripts/production_seo_audit.py'
      - '.github/workflows/production-search-authority-audit.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify crawler script
        run: |
          python3 -m py_compile scripts/production_seo_audit.py
          python3 scripts/production_seo_audit.py --help >/dev/null
          grep -Fq 'AUDIT_CURL_PROXY' scripts/production_seo_audit.py
          grep -Fq 'noindex present on public audited page' scripts/production_seo_audit.py
          grep -Fq 'broken internal link' scripts/production_seo_audit.py
          grep -Fq 'invalid canonical' scripts/production_seo_audit.py

  audit:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOSTINGER_PRIVATE_KEY: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Allow production deploy to settle
        if: github.event_name == 'push'
        run: sleep 35

      - name: Open private Hostinger audit tunnel
        shell: bash
        run: |
          set -euo pipefail
          HOST='145.79.213.68'
          PORT='65002'
          REMOTE_USER='u212644598'
          REMOTE="$REMOTE_USER@$HOST"
          SSH_ARGS=(-p "$PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes)
          KEY="$HOSTINGER_SSH_KEY"
          [ -n "$KEY" ] || KEY="$SSH_PRIVATE_KEY"
          [ -n "$KEY" ] || KEY="$HOSTINGER_PRIVATE_KEY"
          [ -n "$KEY" ] || KEY="$DEPLOY_PRIVATE_KEY"
          PASS="$HOSTINGER_PASSWORD"
          [ -n "$PASS" ] || PASS="$SSH_PASSWORD"

          if [ -n "$KEY" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$KEY" > ~/.ssh/hostinger_key
            chmod 600 ~/.ssh/hostinger_key
            ssh "${SSH_ARGS[@]}" -i ~/.ssh/hostinger_key -fN -D 127.0.0.1:1080 "$REMOTE"
          elif [ -n "$PASS" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            SSHPASS="$PASS" sshpass -e ssh "${SSH_ARGS[@]}" -fN -D 127.0.0.1:1080 "$REMOTE"
          else
            echo "No Hostinger SSH credential available"
            exit 78
          fi

          code=000
          for attempt in $(seq 1 10); do
            code="$(curl --proxy socks5h://127.0.0.1:1080 -L -sS -o /dev/null -w '%{http_code}' --max-time 20 https://hirednext.net/ || true)"
            echo "Tunnel verification attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 2
          done
          test "$code" = "200"
          echo "AUDIT_CURL_PROXY=socks5h://127.0.0.1:1080" >> "$GITHUB_ENV"

      - name: Crawl live search-authority surface through Hostinger
        id: crawl
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/production_seo_audit.py \
            --output-dir artifacts/production-seo-audit \
            --max-pages 180 \
            --max-link-checks 220 \
            | tee artifacts-audit.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish audit summary
        if: always()
        run: |
          if [ -f artifacts/production-seo-audit/summary.md ]; then
            cat artifacts/production-seo-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production audit did not produce a summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hirednext-production-seo-audit-${{ github.run_number }}
          path: |
            artifacts/production-seo-audit/report.json
            artifacts/production-seo-audit/summary.md
            artifacts-audit.log
          if-no-files-found: warn
          retention-days: 30

      - name: Close private audit tunnel
        if: always()
        shell: bash
        run: |
          pkill -f 'ssh .*127.0.0.1:1080' || true

      - name: Fail on critical search-authority defects
        if: always()
        run: |
          test "${{ steps.crawl.outputs.exit_code }}" = "0"
