name: Payment QR Verify

on:
  pull_request:
    paths:
      - 'app/Views/components/business-payment-gate.php'
      - 'app/Config/PaymentIdentity.php'
      - 'app/Views/pages/services/linkedin-leadership-payment.php'
      - 'tests/payment_qr_scan_test.py'
      - 'tests/payment_identity_ironwall_test.php'
      - 'tests/private_linkedin_checkout_test.js'
      - '.github/workflows/payment-qr-verify.yml'
  push:
    branches: [main]
    paths:
      - 'app/Views/components/business-payment-gate.php'
      - 'app/Config/PaymentIdentity.php'
      - 'app/Views/pages/services/linkedin-leadership-payment.php'
      - 'tests/payment_qr_scan_test.py'
      - 'tests/payment_identity_ironwall_test.php'
      - 'tests/private_linkedin_checkout_test.js'
      - '.github/workflows/payment-qr-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install QR decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zbar-tools
      - name: Verify payment identity iron wall
        run: php tests/payment_identity_ironwall_test.php
      - name: Verify private LinkedIn checkout uses central gate
        run: node tests/private_linkedin_checkout_test.js
      - name: Decode and validate central business QR
        run: python3 tests/payment_qr_scan_test.py
