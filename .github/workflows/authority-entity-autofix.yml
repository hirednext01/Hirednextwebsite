name: Align Public Authority Pages to Haryana Entity Facts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/authority-entity-autofix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace stale founding-city and base wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('app/Views/pages/home.php')
          text = home.read_text()
          text = text.replace('Founded in Mumbai', 'Founded', 1)
          home.write_text(text)

          guides = Path('app/Config/DecisionGuides.php')
          text = guides.read_text()
          replacements = {
              "['value' => '2016', 'label' => 'Founded in Mumbai']": "['value' => '2016', 'label' => 'Founded']",
              "['label' => 'Founded', 'value' => '2016 in Mumbai, India']": "['label' => 'Founded', 'value' => '2016']",
              "['label' => 'Operating base', 'value' => 'Gurgaon (Delhi NCR), India']": "['label' => 'GST registered / operating base', 'value' => 'Gurugram (Gurgaon), Haryana, India']",
              "['label' => 'Delivery model', 'value' => 'Primarily remote, with recruiters across India']": "['label' => 'Delivery model', 'value' => 'Remote-first across India; no public walk-in office']",
          }
          for old, new in replacements.items():
              text = text.replace(old, new, 1)
          guides.write_text(text)
          PY

          php -l app/Views/pages/home.php
          php -l app/Config/DecisionGuides.php
          php tests/search_entity_consistency_test.php

          if git diff --quiet -- app/Views/pages/home.php app/Config/DecisionGuides.php; then
            echo 'No changes required'
            exit 0
          fi

          git config user.name 'HiredNext SEO Automation'
          git config user.email 'seo-automation@users.noreply.github.com'
          git add app/Views/pages/home.php app/Config/DecisionGuides.php
          git commit -m 'seo: align authority pages to Haryana entity facts'
          git push origin HEAD:main
