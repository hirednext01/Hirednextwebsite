name: Deploy HiredNext to Hostinger

on:
  push:
    branches: [main]
    paths:
      - '.htaccess'
      - 'public/**'
      - 'app/**'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/hostinger-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hirednext-hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOSTINGER_PRIVATE_KEY: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify resume-routing regression guard
        shell: bash
        run: |
          set -euo pipefail
          for file in .htaccess public/.htaccess; do
            grep -Fq 'RewriteRule ^uploads/resumes/' "$file"
            grep -Fq '/candidate-resume?file=$1' "$file"
            grep -Fq '[R=302,L,NE]' "$file"
          done
          python - <<'PY'
          from pathlib import Path
          for name in ['.htaccess', 'public/.htaccess']:
              text = Path(name).read_text()
              legacy = 'RewriteRule ^uploads/resumes/'
              target = '/candidate-resume?file=$1'
              redirect = '[R=302,L,NE]'
              line = next((line for line in text.splitlines() if legacy in line), '')
              if target not in line or redirect not in line:
                  raise SystemExit(f'{name}: legacy resume links must 302 redirect to the validated controller route')
          PY

      - name: Deploy main to production safely
        id: deploy
        shell: bash
        run: |
          set +e

          HOST='145.79.213.68'
          PORT='65002'
          USER='u212644598'
          REMOTE="${USER}@${HOST}"
          SSH_ARGS=(-p "$PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)

          KEY="${HOSTINGER_SSH_KEY:-${SSH_PRIVATE_KEY:-${HOSTINGER_PRIVATE_KEY:-${DEPLOY_PRIVATE_KEY:-}}}}"
          PASS="${HOSTINGER_PASSWORD:-${SSH_PASSWORD:-}}"
          RESULT='unknown'
          RC=1

          remote_deploy='set -euo pipefail
          cd /home/u212644598/domains/hirednext.net/public_html
          test -d .git || { echo "Production path is not a Git checkout"; exit 20; }
          echo "Before: $(git rev-parse --short HEAD)"
          test -z "$(git status --porcelain)" || { echo "Production checkout has local changes; refusing to overwrite"; git status --short; exit 21; }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main || { echo "Production history diverged from origin/main; refusing non-fast-forward deploy"; exit 22; }
          git pull --ff-only origin main
          php -l app/Views/pages/home.php
          php -l app/Views/layouts/main.php
          php -l app/Config/DecisionGuides.php
          php -l app/Controllers/Home.php
          php -l app/Controllers/Seo.php
          grep -Fq "RewriteRule ^uploads/resumes/" .htaccess
          grep -Fq "/candidate-resume?file=\$1" .htaccess
          grep -Fq "[R=302,L,NE]" .htaccess
          grep -Fq "RewriteRule ^uploads/resumes/" public/.htaccess
          grep -Fq "/candidate-resume?file=\$1" public/.htaccess
          grep -Fq "[R=302,L,NE]" public/.htaccess
          php spark cache:clear >/dev/null 2>&1 || true
          echo "After: $(git rev-parse --short HEAD)"'

          if [[ -n "$KEY" ]]; then
            RESULT='ssh_key_attempted'
            mkdir -p ~/.ssh
            printf '%s\n' "$KEY" > ~/.ssh/hostinger_key
            chmod 600 ~/.ssh/hostinger_key
            ssh "${SSH_ARGS[@]}" -i ~/.ssh/hostinger_key "$REMOTE" "$remote_deploy"
            RC=$?
          elif [[ -n "$PASS" ]]; then
            RESULT='ssh_password_attempted'
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            if [[ $? -eq 0 ]]; then
              SSHPASS="$PASS" sshpass -e ssh "${SSH_ARGS[@]}" "$REMOTE" "$remote_deploy"
              RC=$?
            else
              RC=70
            fi
          else
            RESULT='credential_missing'
            RC=78
          fi

          if [[ "$RC" -eq 0 ]]; then
            RESULT='deployed'
          fi

          printf 'result=%s\nexit_code=%s\nsource_sha=%s\nrun_id=%s\n' "$RESULT" "$RC" "$GITHUB_SHA" "$GITHUB_RUN_ID" > .github/hostinger-deploy-status.txt
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record deploy result
        shell: bash
        run: |
          git config user.name 'HiredNext Deploy Automation'
          git config user.email 'deploy-automation@users.noreply.github.com'
          git add .github/hostinger-deploy-status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Deploy: record Hostinger production result"
          git push origin HEAD:main

      - name: Fail run when production was not deployed
        if: steps.deploy.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Hostinger deployment result: ${{ steps.deploy.outputs.result }}"
          echo "Exit code: ${{ steps.deploy.outputs.exit_code }}"
          exit 1
