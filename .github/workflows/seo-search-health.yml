name: SEO and AI Search Health

on:
  push:
    paths:
      - 'public/robots.txt'
      - 'public/sitemap-search.xml'
      - 'public/recruitment-agency-india/**'
      - 'app/Config/BrandFacts.php'
      - 'app/Config/Routes.php'
      - 'app/Config/DecisionGuides.php'
      - 'tests/career_ai_search_authority_test.php'
      - 'app/Views/pages/career-intelligence.php'
      - 'app/Views/pages/career-authority.php'
      - 'app/Controllers/CareerAuthority.php'
      - 'app/Config/CareerAuthority.php'
      - 'app/Controllers/DecisionGuides.php'
      - 'app/Controllers/LegacyCareerRedirects.php'
      - 'app/Controllers/CandidateServices.php'
      - 'app/Controllers/Jobs.php'
      - 'app/Controllers/EntityAuthority.php'
      - 'app/Controllers/Seo.php'
      - 'app/Controllers/SearchAuthority.php'
      - 'app/Controllers/Authority.php'
      - 'app/Views/pages/services/**'
      - 'app/Views/pages/jobs.php'
      - 'tests/career_service_legacy_consolidation_test.php'
      - 'app/Views/pages/home.php'
      - 'app/Views/pages/founder-profile.php'
      - 'app/Views/layouts/main.php'
      - 'tests/search_entity_consistency_test.php'
      - 'tests/ai_search_authority_test.php'
      - 'tests/google_ai_commercial_intent_test.php'
      - 'tests/city_founder_authority_test.php'
      - 'tests/cv_search_dominance_test.php'
      - 'tests/career_services_product_engine_test.php'
      - '.github/workflows/indexnow.yml'
      - '.github/workflows/seo-search-health.yml'
  pull_request:
    paths:
      - 'public/robots.txt'
      - 'public/sitemap-search.xml'
      - 'public/recruitment-agency-india/**'
      - 'app/Config/BrandFacts.php'
      - 'app/Config/Routes.php'
      - 'app/Config/DecisionGuides.php'
      - 'app/Controllers/DecisionGuides.php'
      - 'app/Controllers/CandidateServices.php'
      - 'app/Controllers/Jobs.php'
      - 'app/Controllers/EntityAuthority.php'
      - 'app/Controllers/Seo.php'
      - 'app/Controllers/SearchAuthority.php'
      - 'app/Controllers/Authority.php'
      - 'app/Views/pages/services/**'
      - 'app/Views/pages/jobs.php'
      - 'app/Views/pages/founder-profile.php'
      - 'app/Views/layouts/main.php'
      - 'tests/search_entity_consistency_test.php'
      - 'tests/ai_search_authority_test.php'
      - 'tests/google_ai_commercial_intent_test.php'
      - 'tests/city_founder_authority_test.php'
      - '.github/workflows/indexnow.yml'
      - '.github/workflows/seo-search-health.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify PHP syntax
        run: |
          php -l app/Config/BrandFacts.php
          php -l app/Config/Routes.php
          php -l app/Config/DecisionGuides.php
          if [ -f app/Config/CareerAuthority.php ]; then php -l app/Config/CareerAuthority.php; fi
          if [ -f app/Controllers/CareerAuthority.php ]; then php -l app/Controllers/CareerAuthority.php; fi
          if [ -f app/Views/pages/career-authority.php ]; then php -l app/Views/pages/career-authority.php; fi
          if [ -f app/Views/pages/career-intelligence.php ]; then php -l app/Views/pages/career-intelligence.php; fi
          php -l app/Controllers/DecisionGuides.php
          php -l app/Controllers/LegacyCareerRedirects.php
          php -l app/Controllers/CandidateServices.php
          php -l app/Controllers/Jobs.php
          php -l app/Controllers/EntityAuthority.php
          php -l app/Controllers/Seo.php
          php -l app/Controllers/SearchAuthority.php
          php -l app/Controllers/Authority.php
          php -l app/Views/pages/services/candidate-services.php
          php -l app/Views/pages/services/cv-assessment.php
          php -l app/Views/pages/services/cv-service-product.php
          php -l app/Views/pages/services/executive-cv.php
          php -l app/Views/pages/services/_cv-service-faq.php
          php -l app/Views/pages/services/client-services.php
          php -l app/Views/pages/jobs.php
          php -l app/Views/pages/founder-profile.php
          php -l app/Views/layouts/main.php
      - name: Verify search/entity consistency
        run: php tests/search_entity_consistency_test.php
      - name: Verify AI search authority contracts
        run: |
          php tests/ai_search_authority_test.php
          php tests/google_ai_commercial_intent_test.php
          php tests/city_founder_authority_test.php
          php tests/cv_search_dominance_test.php
          php tests/career_services_product_engine_test.php
          php tests/career_ai_search_authority_test.php
          php tests/career_service_legacy_consolidation_test.php
      - name: Verify candidate service regressions
        run: |
          php tests/cv_assessment_conversion_test.php
          php tests/cv_public_checkout_test.php
          php tests/authority_api_response_test.php
      - name: Verify focused sitemap XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('public/sitemap-search.xml')
          print('PASS sitemap XML')
          PY
