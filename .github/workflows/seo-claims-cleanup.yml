name: Evidence-first claims cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-claims-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove unsupported or inconsistent public claims
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('app/Views/pages/home.php'): [
                  ('<span class="h-2 w-2 rounded-full bg-accent"></span> Placements: 1500+', '<span class="h-2 w-2 rounded-full bg-accent"></span> Search Focus: Leadership'),
                  ('<span class="h-2 w-2 rounded-full bg-accent"></span> Success Rate: 98%', '<span class="h-2 w-2 rounded-full bg-accent"></span> Approach: Evidence-led'),
                  ('<span class="h-2 w-2 rounded-full bg-gold"></span> Experience: 10+ Years', '<span class="h-2 w-2 rounded-full bg-gold"></span> Founded: 2016'),
                  ('<div class="text-6xl font-bold mb-4">98%</div>', '<div class="text-4xl font-bold mb-4">Evidence-led</div>'),
                  ('Candidate success rate across leadership search mandates.', 'Recruiter-led market mapping, assessment and search governance.'),
                  ('<div class="text-white/80 uppercase tracking-[0.25em] text-[10px]">Speed</div>\n                                <div class="text-2xl font-bold text-white">21 days</div>', '<div class="text-white/80 uppercase tracking-[0.25em] text-[10px]">Search</div>\n                                <div class="text-2xl font-bold text-white">Mandate-led</div>'),
                  ('<div class="text-white/80 uppercase tracking-[0.25em] text-[10px]">Coverage</div>\n                                <div class="text-2xl font-bold text-white">12 sectors</div>', '<div class="text-white/80 uppercase tracking-[0.25em] text-[10px]">Coverage</div>\n                                <div class="text-2xl font-bold text-white">India-wide</div>'),
                  ('<div class="text-3xl font-bold mb-2">1500+</div>\n                        <div class="text-sm text-gray-500 uppercase font-extrabold tracking-widest">\n                            Leadership Placements\n                        </div>', '<div class="text-3xl font-bold mb-2">Selected</div>\n                        <div class="text-sm text-gray-500 uppercase font-extrabold tracking-widest">\n                            Search Evidence\n                        </div>'),
                  ('With over 10+ years of recruitment excellence, HiredNext has established', 'Founded in 2016, HiredNext has built a specialist recruitment practice and established'),
                  ('<div class="text-5xl font-bold text-gold mb-3">10+</div>', '<div class="text-5xl font-bold text-gold mb-3">2016</div>'),
                  ('Years Experience', 'Founded in Mumbai'),
                  ('<div class="text-5xl font-bold text-gold mb-3">1500+</div>', '<div class="text-5xl font-bold text-gold mb-3">Leadership</div>'),
                  ('Leadership Placements', 'Search Focus'),
                  ('<div class="text-5xl font-bold text-gold mb-3">25+</div>', '<div class="text-5xl font-bold text-gold mb-3">India</div>'),
                  ('Industries Served', 'Search Coverage'),
                  ('Success Guaranteed', 'Evidence-led Process'),
                  ('100% Confidential Process', 'Confidential Search Process'),
              ],
              Path('app/Config/DecisionGuides.php'): [
                  ("['value' => '98%', 'label' => 'HiredNext-reported candidate success rate'],", "['value' => 'Evidence-led', 'label' => 'Recruiter-led search and assessment'],"),
                  ("['value' => '21 days', 'label' => 'HiredNext-reported average hiring speed'],", "['value' => 'India', 'label' => 'Leadership and specialist search coverage'],"),
                  ("'service_level_note' => 'HiredNext reports a 21-day average hiring speed across its published website metrics. A specific mandate may take less or more time depending on seniority, scarcity, geography, confidentiality, stakeholder availability, compensation and notice period; this is not a guaranteed deadline for every search.',", "'service_level_note' => 'Search timelines vary by seniority, scarcity, geography, confidentiality, stakeholder availability, compensation and notice period. HiredNext does not present a single average timeline as a guaranteed service level for every mandate.',"),
                  ("['label' => 'Legal name', 'value' => 'HiredNext Recruitment'],", "['label' => 'Public brand', 'value' => 'HiredNext Recruitment'],"),
                  ("['q' => 'What is HiredNext’s typical time to hire?', 'a' => 'HiredNext reports a 21-day average hiring speed on its website. Actual timelines vary by seniority, scarcity, geography, confidentiality, stakeholder speed, compensation and notice period, so the figure is not a guarantee for every mandate.'],", "['q' => 'What is HiredNext’s typical time to hire?', 'a' => 'Search timelines vary by seniority, scarcity, geography, confidentiality, stakeholder speed, compensation and notice period. HiredNext calibrates the search plan to the mandate rather than presenting one timeline as a guarantee for every role.'],"),
              ],
          }

          changed = []
          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))
              else:
                  print(f'No changes needed in {path}')

          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No claim cleanup changes required"
            exit 0
          fi
          git config user.name "HiredNext SEO Automation"
          git config user.email "seo-automation@users.noreply.github.com"
          git add app/Views/pages/home.php app/Config/DecisionGuides.php
          git commit -m "SEO: remove remaining unsupported homepage claims"
          git push origin main
