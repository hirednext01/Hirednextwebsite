name: Apply testimonial dedupe fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-testimonial-dedupe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch testimonial classification and dedupe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/Controllers/ReputationAuthority.php')
          text = path.read_text()

          old = """            if ($name !== '' && $quote !== '') {
                $keys[] = 'content:' . hash('sha256', $name . '|' . $quote);
            }
"""
          new = """            if ($name !== '' && $quote !== '') {
                $keys[] = 'content:' . hash('sha256', $name . '|' . $quote);
                $quotePrefix = mb_substr($quote, 0, 180);
                if (mb_strlen($quotePrefix) >= 60) {
                    $keys[] = 'near-content:' . hash('sha256', $name . '|' . $quotePrefix);
                }
            }
"""
          if 'near-content:' not in text:
              if old not in text:
                  raise SystemExit('content dedupe block not found')
              text = text.replace(old, new, 1)

          old = """            if ($this->testimonialProofScore($item) > $this->testimonialProofScore($unique[$existingIndex])) {
                $unique[$existingIndex] = $item;
            }
"""
          new = """            $itemPriority = $this->testimonialRecordPriority($item);
            $existingPriority = $this->testimonialRecordPriority($unique[$existingIndex]);
            if (
                $itemPriority > $existingPriority
                || ($itemPriority === $existingPriority && $this->testimonialProofScore($item) > $this->testimonialProofScore($unique[$existingIndex]))
            ) {
                $unique[$existingIndex] = $item;
            }
"""
          if 'testimonialRecordPriority($item)' not in text:
              if old not in text:
                  raise SystemExit('winner selection block not found')
              text = text.replace(old, new, 1)

          if 'private function testimonialRecordPriority' not in text:
              marker = """    private function testimonialProofScore(array $item): int
    {
"""
              method = """    private function testimonialRecordPriority(array $item): int
    {
        $relationship = trim((string)($item['relationship_type'] ?? ''));
        $submittedVia = trim((string)($item['submitted_via'] ?? ''));
        $proofType = mb_strtolower(trim((string)($item['proof_type'] ?? $item['project_type'] ?? '')));

        if ($submittedVia === 'candidate_placement_testimonial_form' || $relationship === 'placed_candidate') {
            return 300;
        }
        if ($relationship === 'employer') {
            return 270;
        }

        $explicitEmployerTypes = [
            'employer recruitment experience',
            'employer recruitment delivery',
            'apparel & textile recruitment',
            'talent evaluation',
            'recruitment experience',
        ];
        if (in_array($proofType, $explicitEmployerTypes, true)) {
            return 260;
        }
        if ($relationship === 'candidate_professional' || $submittedVia === 'candidate_testimonial_form') {
            return 200;
        }
        if (($item['status'] ?? '') === 'external') {
            return 150;
        }
        return 100;
    }

"""
              if marker not in text:
                  raise SystemExit('proof score marker not found')
              text = text.replace(marker, method + marker, 1)

          old_norm = """    private function normalizeProofText(string $value): string
    {
        $value = mb_strtolower(trim(strip_tags($value)));
        return preg_replace('/\\s+/u', ' ', $value) ?? $value;
    }
"""
          new_norm = """    private function normalizeProofText(string $value): string
    {
        $value = mb_strtolower(trim(strip_tags($value)));
        $value = preg_replace('/[^\\p{L}\\p{N}\\s]+/u', ' ', $value) ?? $value;
        $value = preg_replace('/\\s+/u', ' ', $value) ?? $value;
        return trim($value);
    }
"""
          if old_norm in text:
              text = text.replace(old_norm, new_norm, 1)
          elif new_norm not in text:
              raise SystemExit('normalization block not found')

          path.write_text(text)
          PY

          php -l app/Controllers/ReputationAuthority.php
          grep -Fq 'near-content:' app/Controllers/ReputationAuthority.php
          grep -Fq 'testimonialRecordPriority' app/Controllers/ReputationAuthority.php

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- app/Controllers/ReputationAuthority.php; then
            exit 0
          fi
          git config user.name 'HiredNext Fix Automation'
          git config user.email 'fix-automation@users.noreply.github.com'
          git add app/Controllers/ReputationAuthority.php
          git commit -m 'Fix: prevent testimonial cross-bucket duplication'
          git push origin HEAD:main
