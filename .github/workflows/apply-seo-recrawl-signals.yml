name: Apply SEO Recrawl Signals

on:
  push:
    branches: [seo-recrawl-signals-2026-09-16]
    paths:
      - '.github/workflows/apply-seo-recrawl-signals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-recrawl-signals-2026-09-16
      - name: Apply freshness, internal-link and AI-discovery signals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          guides = Path('app/Config/DecisionGuides.php')
          text = guides.read_text()
          old = "public string $updatedOn = '2026-08-24';"
          new = "public string $updatedOn = '2026-09-16';"
          if old not in text and new not in text:
              raise SystemExit('DecisionGuides updatedOn shape changed')
          guides.write_text(text.replace(old, new, 1))

          seo = Path('app/Controllers/Seo.php')
          text = seo.read_text()
          old = "['loc' => base_url(), 'lastmod' => '2026-08-24', 'changefreq' => 'weekly', 'priority' => '1.0']"
          new = "['loc' => base_url(), 'lastmod' => '2026-09-16', 'changefreq' => 'weekly', 'priority' => '1.0']"
          if old not in text and new not in text:
              raise SystemExit('Homepage sitemap lastmod shape changed')
          text = text.replace(old, new, 1)

          needle = "            '- [Services for Clients](' . base_url('services/clients') . '): Executive search, permanent hiring and RPO for employers.',"
          insert = "            '- [Recruitment Agency India](' . base_url('recruitment-agency-india/') . '): HiredNext Recruitment for executive search, leadership, mid-senior and specialist hiring across India.',\n" + needle
          if "[Recruitment Agency India](' . base_url('recruitment-agency-india/')" not in text:
              if needle not in text:
                  raise SystemExit('llms core-pages insertion point changed')
              text = text.replace(needle, insert, 1)
          seo.write_text(text)

          layout = Path('app/Views/layouts/main.php')
          text = layout.read_text()
          needle = "                        <a href=\"<?= base_url('services/executive-search') ?>\" class=\"hover:text-accent\">Executive Search India</a>"
          insert = "                        <a href=\"<?= base_url('recruitment-agency-india/') ?>\" class=\"hover:text-accent\">Recruitment Agency India</a>\n                        <span>•</span>" + needle
          if "base_url('recruitment-agency-india/')" not in text:
              if needle not in text:
                  raise SystemExit('footer insertion point changed')
              text = text.replace(needle, insert, 1)
          layout.write_text(text)
          PY

          php -l app/Config/DecisionGuides.php
          php -l app/Controllers/Seo.php
          php -l app/Views/layouts/main.php
          php tests/search_entity_consistency_test.php
          php tests/search_recrawl_signals_test.php

          git config user.name 'HiredNext SEO Automation'
          git config user.email 'seo-automation@users.noreply.github.com'
          if git diff --quiet -- app/Config/DecisionGuides.php app/Controllers/Seo.php app/Views/layouts/main.php; then
            echo 'No changes required'
            exit 0
          fi
          git add app/Config/DecisionGuides.php app/Controllers/Seo.php app/Views/layouts/main.php
          git commit -m 'seo: refresh Google and AI discovery signals'
          git push origin HEAD:seo-recrawl-signals-2026-09-16
