name: Broad Authority Blog Verify

on:
  push:
    branches:
      - seo/broad-recruitment-authority-blogs-2026-09-10
  pull_request:
    paths:
      - 'app/Config/BroadRecruitmentAuthorityBlogs.php'
      - 'app/Commands/SeedBroadRecruitmentAuthorityBlogs.php'
      - 'tests/broad_recruitment_authority_blogs_test.php'
      - '.github/workflows/broad-authority-blog-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php tests/broad_recruitment_authority_blogs_test.php
