name: Hostinger Origin Audit Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hostinger-origin-audit-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      HOSTINGER_PRIVATE_KEY: ${{ secrets.HOSTINGER_PRIVATE_KEY }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
      HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Probe Hostinger origin paths
        shell: bash
        run: |
          set -euo pipefail
          HOST='145.79.213.68'
          PORT='65002'
          USER='u212644598'
          REMOTE="${USER}@${HOST}"
          SSH_ARGS=(-p "$PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15)
          KEY="${HOSTINGER_SSH_KEY:-${SSH_PRIVATE_KEY:-${HOSTINGER_PRIVATE_KEY:-${DEPLOY_PRIVATE_KEY:-}}}}"
          PASS="${HOSTINGER_PASSWORD:-${SSH_PASSWORD:-}}"

          read -r -d '' REMOTE_CMD <<'EOF' || true
          set -u
          cd /home/u212644598/domains/hirednext.net/public_html
          echo "python3=$(command -v python3 || true)"
          python3 --version 2>&1 || true
          echo "public_home=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 https://hirednext.net/ || true)"
          echo "public_robots=$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 https://hirednext.net/robots.txt || true)"
          echo "localhost_http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Host: hirednext.net' http://127.0.0.1/ || true)"
          echo "localhost_https=$(curl -k -L -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve hirednext.net:443:127.0.0.1 https://hirednext.net/ || true)"
          echo "origin_ip_http=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Host: hirednext.net' http://145.79.213.68/ || true)"
          EOF

          if [[ -n "$KEY" ]]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$KEY" > ~/.ssh/hostinger_key
            chmod 600 ~/.ssh/hostinger_key
            ssh "${SSH_ARGS[@]}" -i ~/.ssh/hostinger_key "$REMOTE" "$REMOTE_CMD"
          elif [[ -n "$PASS" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            SSHPASS="$PASS" sshpass -e ssh "${SSH_ARGS[@]}" "$REMOTE" "$REMOTE_CMD"
          else
            echo "No Hostinger SSH credential available"
            exit 78
          fi
